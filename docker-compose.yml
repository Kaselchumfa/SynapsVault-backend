services:
  # SynapsVault Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapsvault-backend
    ports:
      - "3000:3000"
    # All app settings come from .env (see .env.example); the values below
    # point the container at the bundled Postgres.
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://synapse:synapse@postgres:5432/synapsvault
      NODE_ENV: ${NODE_ENV:-development}
      # The ledger checkpoint is stored in Postgres; this file path is only
      # used as a fallback when the database is unavailable.
      LEDGER_TRACKER_PATH: /app/data/last-processed-ledger.json

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      # Persist the file-based ledger checkpoint fallback across container
      # recreation. The primary checkpoint lives in Postgres.
      - ledger_data:/app/data

    networks:
      - synapsvault

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: synapsvault-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapsvault
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse", "-d", "synapsvault"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - synapsvault

volumes:
  postgres_data:
    driver: local
  ledger_data:
    driver: local

networks:
  synapsvault:
    driver: bridge